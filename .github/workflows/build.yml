name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the older build, so two runs never race to publish the release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk reach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reach-apk
          path: reach.apk

      # Keeps a "latest" release pointing at the newest main build, so the APK
      # can be downloaded straight from the phone's browser. The release is
      # updated in place: deleting and recreating it races GitHub's cleanup.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7}. Download reach.apk on your phone to install."
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest reach.apk --clobber
            gh release edit latest --prerelease --title "Latest build" --notes "$notes"
          else
            gh release create latest reach.apk --prerelease --title "Latest build" --notes "$notes"
          fi
